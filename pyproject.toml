[project]
name = "lang-graph-json"
version = "0.1.0"
description = "Generic multi-agent server (LangGraph + FastAPI) driven entirely by JSON configuration files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-ollama>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "websockets>=12",
]

[project.optional-dependencies]
sqlite = ["langgraph-checkpoint-sqlite>=2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "pyinstaller>=6.6", "langgraph-checkpoint-sqlite>=2"]

[project.scripts]
lang-graph-json = "langgraph_json.__main__:main"
generate-tools-json = "langgraph_json.tools_parser:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["langgraph_json*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests calling a real LLM (need ANTHROPIC_API_KEY or LGJ_TEST_PROVIDER_JSON, from the environment or .env)",
    "dist: tests of the PyInstaller bundle in dist/ (skipped when it is not built)",
]
