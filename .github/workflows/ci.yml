name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: tools.json is in sync with the C++ example
        run: python scripts/generate_tools_json.py --source-dir examples/cpp --output config/tools.json --check
      - name: Tests (offline, coverage)
        run: python -m pytest --cov=langgraph_json --cov-report=term-missing --cov-fail-under=100
      - name: Live tests (only when the ANTHROPIC_API_KEY secret is set)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest -m live -v
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Wheel + PyInstaller bundle (with smoke tests)
        run: python scripts/build.py all --zip
      - name: Tests of the bundle
        run: python -m pytest -m dist -v
      - uses: actions/upload-artifact@v4
        with:
          name: lang-graph-json-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.zip

  cpp-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the C++ example (AI_METADATA is transparent for the compiler)
        run: |
          cmake -S examples/cpp -B build/cpp
          cmake --build build/cpp
          ./build/cpp/ai_metadata_example
          diff build/cpp/tools.json config/tools.json
      - name: qmake integration (qmake/ai_metadata.pri)
        run: |
          sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-base-dev-tools
          python -m pip install -e ".[dev]"
          LGJ_QMAKE=$(command -v qmake6) LGJ_MAKE=make python -m pytest tests/test_qmake.py -v
